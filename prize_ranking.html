    .rankings-page{
      width:min(100%, 600px);

    .page-top{

    .page-header-block h1{

      text-wrap:balance;
      overflow-wrap:anywhere;

    }

    .top3-wrap{
      margin-bottom:18px;
    }

    .top3-list{
      display:flex;
      flex-direction:column;
      gap:0;
      padding:0 12px;
      border:1px solid #d9dde3;
      border-radius:18px;

      align-items:center;

    .top3-row + .top3-row{

    .top3-left{
      min-width:0;
      display:grid;
      grid-template-columns:58px minmax(0,1fr);
      align-items:center;

      font-weight:800;

    .top3-medal{
      display:block;
      padding-right:8px;

    .top3-name{

    .prize-note{

    .prize-affiliate-slot{
      display:grid;
      grid-template-columns:repeat(2, minmax(0, 1fr));

      display:flex;
      align-items:center;
      justify-content:center;
      width:100%;
      box-sizing:border-box;
      margin:0;
      padding:0;
      border:0;
      border-radius:0;
      background:transparent;
      box-shadow:none;

      text-decoration:none !important;
      overflow:visible;

        transform:translateY(-2px);

      .prize-pc-affiliate-rail .prize-affiliate-image{

      .prize-pc-affiliate-rail .prize-affiliate-card.is-wide .prize-affiliate-image{

    @media (max-width:640px){

      .top3-row{

      .prize-affiliate-card.is-wide .prize-affiliate-image{

<body>
  <div id="site-header"></div>

  <div class="rankings-page">
    <div class="page-top">
      <div class="page-header-block">
        <h1>賞金ランキング</h1>
      </div>

      <p class="prize-note">※チーム戦の優勝賞金は、優勝チームの所属人数で按分して集計しています。</p>
    </div>

    <div class="top3-wrap">
      <div id="top3" class="top3-list"></div>
    </div>

    <div id="prize-affiliate-slot-1" class="prize-affiliate-slot is-first" aria-label="Amazonおすすめ"></div>

    <section class="card">
      <div class="prize-card-inner">
        <p id="prize-status" class="muted"></p>

        <div class="prize-table-wrap">
          <table class="prize-table">
            <colgroup>
              <col />
              <col />
              <col />
            </colgroup>
            <tbody id="prize-body"></tbody>
          </table>
        </div>
      </div>
    </section>

    <div id="prize-affiliate-slot-2" class="prize-affiliate-slot is-last" aria-label="Amazonおすすめ"></div>

    <p class="associate-disclosure">
      Amazonのアソシエイトとして、MCBattle.jpは適格販売により収入を得ています。
    </p>
  </div>

  <aside id="prize-pc-affiliate-rail" class="prize-pc-affiliate-rail" aria-label="Amazonおすすめ"></aside>

  <script>
    const PRIZE_JSON_URL = "./data/prize_rankings.json";
    const TOP_JSON_URL = "./data/top.json";

    async function loadPrizeJson() {
      const res = await fetch(PRIZE_JSON_URL, { cache: "no-store" });
      if (!res.ok) {
        throw new Error(`HTTP ${res.status}`);
      }
      return await res.json();
    }


    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function shuffleArray(items) {
      const result = [...items];

      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }

      return result;
    }

    function normalizeAffiliateItems(items) {
      if (!Array.isArray(items)) return [];

      const seenLinks = new Set();

      return items
        .map((item) => {
          const link = String(item?.link ?? "").trim();
          const image = String(
            item?.image ??
            item?.image_url ??
            item?.img ??
            ""
          ).trim();
          const title = String(
            item?.title ??
            item?.txt ??
            ""
          ).trim();

          return {
            no: item?.no ?? "",
            link,
            image,
            title
          };
        })
        .filter((item) => {
          if (!item.link || !item.image) return false;
          if (seenLinks.has(item.link)) return false;

          seenLinks.add(item.link);
          return true;
        });
    }

    function updateAffiliateSlotLayout(slot) {
      if (!slot || !slot.classList.contains("prize-affiliate-slot")) return;

      const cards = Array.from(slot.querySelectorAll(".prize-affiliate-card"));
      if (!cards.length) return;

      const allFinished = cards.every((card) => {
        const img = card.querySelector(".prize-affiliate-image");
        return !img || img.complete;
      });

      if (!allFinished) return;

      cards.forEach((card) => card.classList.remove("is-hidden-by-layout"));

      const wideCards = cards.filter((card) => card.classList.contains("is-wide"));

      // If a mobile/tablet slot contains a wide image, show only that wide image.
      // Otherwise keep both products in the two-column grid.
      if (wideCards.length) {
        const chosenWide = wideCards[0];

        cards.forEach((card) => {
          if (card !== chosenWide) {
            card.classList.add("is-hidden-by-layout");
          }
        });
      }
    }

    function classifyAffiliateImage(img) {
      if (!img) return;

      const card = img.closest(".prize-affiliate-card");
      if (!card) return;

      if (img.naturalWidth && img.naturalHeight) {
        const ratio = img.naturalWidth / img.naturalHeight;
        card.classList.toggle("is-wide", ratio >= 1.4);
      } else {
        card.classList.remove("is-wide");
      }

      updateAffiliateSlotLayout(card.parentElement);
    }

    function buildAffiliateCard(item) {
      const label = item.title || "Amazonの商品を見る";

      return `
        <a
          class="prize-affiliate-card"
          href="${escapeHtml(item.link)}"
          target="_blank"
          rel="nofollow sponsored noopener noreferrer"
          aria-label="${escapeHtml(label)}"
          title="${escapeHtml(label)}"
        >
          <img
            class="prize-affiliate-image"
            src="${escapeHtml(item.image)}"
            alt="${escapeHtml(label)}"
            loading="lazy"
            decoding="async"
            onload="classifyAffiliateImage(this)"
            onerror="classifyAffiliateImage(this)"
          >
        </a>
      `;
    }

    async function loadRankingAffiliate() {
      const slot1 = document.getElementById("prize-affiliate-slot-1");
      const slot2 = document.getElementById("prize-affiliate-slot-2");
      const pcRail = document.getElementById("prize-pc-affiliate-rail");

      try {
        const res = await fetch(TOP_JSON_URL, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const payload = await res.json();
        const products = shuffleArray(normalizeAffiliateItems(payload?.index_af));
        const selected = products.slice(0, 4);
        const pcSelected = selected.slice(0, 2);

        if (slot1) {
          slot1.innerHTML = selected.slice(0, 2).map(buildAffiliateCard).join("");
        }

        if (slot2) {
          slot2.innerHTML = selected.slice(2, 4).map(buildAffiliateCard).join("");
        }

        if (pcRail) {
          pcRail.innerHTML = pcSelected.map(buildAffiliateCard).join("");
        }
      } catch (err) {
        console.error("affiliate load failed:", err);
        if (slot1) slot1.innerHTML = "";
        if (slot2) slot2.innerHTML = "";
        if (pcRail) pcRail.innerHTML = "";
      }
    }

    function toNumber(v) {
      if (v === null || v === undefined || v === "") return NaN;
      if (typeof v === "number") return Number.isFinite(v) ? v : NaN;
      const cleaned = String(v).replace(/[^\d.-]/g, "");
      const n = Number(cleaned);
      return Number.isFinite(n) ? n : NaN;
    }

    function formatMoney(v) {
      const n = toNumber(v);
      const rounded = Number.isFinite(n) ? Math.round(n) : 0;
      return "¥" + rounded.toLocaleString("ja-JP");
    }

    function getPrizeAmount(item) {
      const candidates = [
        item.total_prize_money,
        item.total_prize,
        item.prize_total,
        item.total_amount,
        item.amount,
        item.prize,
        item.prize_money,
        item.totalPrize,
        item.totalPrizeAmount,
        item.winning_amount,
        item.money,
        item.賞金,
        item.総賞金
      ];

      for (const value of candidates) {
        const n = toNumber(value);
        if (Number.isFinite(n)) return n;
      }
      return 0;
    }

    function medalEmoji(rank) {
      if (rank === 1) return "🥇";
      if (rank === 2) return "🥈";
      if (rank === 3) return "🥉";
      return "";
    }

    function normalizeItems(data) {
      const source =
        Array.isArray(data.rankings) ? data.rankings :
        Array.isArray(data.items) ? data.items :
        Array.isArray(data.data) ? data.data :
        Array.isArray(data) ? data : [];

      return source
        .map((item, index) => ({
          rank: Number(item.rank) || (index + 1),
          mc_id: item.mc_id || "",
          mc_name: item.mc_name || item.name || "名前不明",
          amount: getPrizeAmount(item)
        }))
        .filter(item => item.mc_name)
        .sort((a, b) => {
          if (b.amount !== a.amount) return b.amount - a.amount;
          return a.rank - b.rank;
        })
        .map((item, index) => ({
          ...item,
          rank: index + 1
        }));
    }

    function buildTop3(items) {
      return items.map(item => {
        const wrapper = document.createElement("div");
        wrapper.className = "top3-row";

        const left = document.createElement("div");
        left.className = "top3-left";

        const medal = document.createElement("span");
        medal.className = "top3-medal";
        medal.setAttribute("aria-hidden", "true");
        medal.textContent = medalEmoji(item.rank);

        const nameWrap = document.createElement("span");
        nameWrap.className = "top3-name";

        if (item.mc_id) {
          const a = document.createElement("a");
          a.href = `detail_mc/${encodeURIComponent(item.mc_id)}.html`;
          a.textContent = item.mc_name;
          a.title = item.mc_name;
          nameWrap.appendChild(a);
        } else {
          nameWrap.textContent = item.mc_name;
          nameWrap.title = item.mc_name;
        }

        const amount = document.createElement("div");
        amount.className = "top3-amount";
        amount.textContent = formatMoney(item.amount);

        left.appendChild(medal);
        left.appendChild(nameWrap);
        wrapper.appendChild(left);
        wrapper.appendChild(amount);

        return wrapper;
      });
    }

    function loadPrizePage() {
      const statusEl = document.getElementById("prize-status");
      const top3El = document.getElementById("top3");
      const bodyEl = document.getElementById("prize-body");

      loadPrizeJson()
        .then((data) => {
          console.log("prize rankings page:", data);

          top3El.innerHTML = "";
          bodyEl.innerHTML = "";
          statusEl.classList.remove("error");

          try {
            if (data.error) {
              statusEl.textContent = "賞金ランキングの取得に失敗しました: " + (data.message || "");
              statusEl.classList.add("error");
              return;
            }

            const items = normalizeItems(data);
            const top3 = items.slice(0, 3);
            const rest = items.slice(3);

            buildTop3(top3).forEach(node => top3El.appendChild(node));

            rest.forEach((item) => {
              const tr = document.createElement("tr");

              const rankTd = document.createElement("td");
              const nameTd = document.createElement("td");
              const amountTd = document.createElement("td");

              rankTd.textContent = item.rank;
              rankTd.className = "prize-rank";

              if (item.mc_id) {
                const a = document.createElement("a");
                a.href = `detail_mc/${encodeURIComponent(item.mc_id)}.html`;
                a.textContent = item.mc_name;
                a.className = "prize-name-link";
                nameTd.appendChild(a);
              } else {
                const span = document.createElement("span");
                span.textContent = item.mc_name;
                span.className = "prize-name-text";
                nameTd.appendChild(span);
              }

              amountTd.textContent = formatMoney(item.amount);
              amountTd.className = "prize-amount";

              tr.appendChild(rankTd);
              tr.appendChild(nameTd);
              tr.appendChild(amountTd);

              bodyEl.appendChild(tr);
            });

            statusEl.textContent = "";
          } catch (err) {
            console.error(err);
            statusEl.textContent = "賞金ランキングの描画に失敗しました";
            statusEl.classList.add("error");
          }
        })
        .catch((err) => {
          console.error(err);
          statusEl.textContent = "賞金ランキングの読み込みに失敗しました";
          statusEl.classList.add("error");
        });
    }

    loadPrizePage();
    loadRankingAffiliate();
  </script>
  <script src="site-header.js"></script>
</body>
</html>
