    .page-header-block h1{

    .spec-card-link{

    .top3-list{

    .score-affiliate-slot{

<body>
  <div id="site-header"></div>

  <div class="rankings-page">
    <div class="page-top">
      <div class="page-header-block">
        <h1>スコアランキング</h1>
      </div>

      <a class="spec-card-link" href="score_spec.html">
        <p class="spec-card-title">【重要】スコアリングの考え方</p>
      </a>
    </div>

    <div class="top3-wrap">
      <div id="top3" class="top3-list"></div>
    </div>

    <div id="score-affiliate-slot-1" class="score-affiliate-slot is-first" aria-label="Amazonおすすめ"></div>

    <section class="card">
      <div class="rankings-card-inner">
        <div class="rankings-card-head">
          <p id="rankings-status" class="muted"></p>
        </div>

        <div class="rankings-table-wrap">
          <table class="rankings-table">
            <colgroup>
              <col />
              <col />
              <col />
            </colgroup>
            <tbody id="rankings-body"></tbody>
          </table>
        </div>
      </div>
    </section>

    <div id="score-affiliate-slot-2" class="score-affiliate-slot is-last" aria-label="Amazonおすすめ"></div>

    <p class="associate-disclosure">
      Amazonのアソシエイトとして、MCBattle.jpは適格販売により収入を得ています。
    </p>
  </div>

  <aside id="score-pc-affiliate-rail" class="score-pc-affiliate-rail" aria-label="Amazonおすすめ"></aside>

  <script>
    const RANKINGS_JSON_URL = "./data/rankings.json";
    const TOP_JSON_URL = "./data/top.json";

    async function loadRankingsJson() {
      const res = await fetch(RANKINGS_JSON_URL, { cache: "no-store" });
      if (!res.ok) {
        throw new Error(`HTTP ${res.status}`);
      }
      return await res.json();
    }


    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function shuffleArray(items) {
      const result = [...items];

      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }

      return result;
    }

    function normalizeAffiliateItems(items) {
      if (!Array.isArray(items)) return [];

      const seenLinks = new Set();

      return items
        .map((item) => {
          const link = String(item?.link ?? "").trim();
          const image = String(
            item?.image ??
            item?.image_url ??
            item?.img ??
            ""
          ).trim();
          const title = String(
            item?.title ??
            item?.txt ??
            ""
          ).trim();

          return {
            no: item?.no ?? "",
            link,
            image,
            title
          };
        })
        .filter((item) => {
          if (!item.link || !item.image) return false;
          if (seenLinks.has(item.link)) return false;

          seenLinks.add(item.link);
          return true;
        });
    }

    function updateAffiliateSlotLayout(slot) {
      if (!slot || !slot.classList.contains("score-affiliate-slot")) return;

      const cards = Array.from(slot.querySelectorAll(".score-affiliate-card"));
      if (!cards.length) return;

      const allFinished = cards.every((card) => {
        const img = card.querySelector(".score-affiliate-image");
        return !img || img.complete;
      });

      if (!allFinished) return;

      cards.forEach((card) => card.classList.remove("is-hidden-by-layout"));

      const wideCards = cards.filter((card) => card.classList.contains("is-wide"));

      // If a mobile/tablet slot contains a wide image, show only that wide image.
      // Otherwise keep both products in the two-column grid.
      if (wideCards.length) {
        const chosenWide = wideCards[0];

        cards.forEach((card) => {
          if (card !== chosenWide) {
            card.classList.add("is-hidden-by-layout");
          }
        });
      }
    }

    function classifyAffiliateImage(img) {
      if (!img) return;

      const card = img.closest(".score-affiliate-card");
      if (!card) return;

      if (img.naturalWidth && img.naturalHeight) {
        const ratio = img.naturalWidth / img.naturalHeight;
        card.classList.toggle("is-wide", ratio >= 1.4);
      } else {
        card.classList.remove("is-wide");
      }

      updateAffiliateSlotLayout(card.parentElement);
    }

    function buildAffiliateCard(item) {
      const label = item.title || "Amazonの商品を見る";

      return `
        <a
          class="score-affiliate-card"
          href="${escapeHtml(item.link)}"
          target="_blank"
          rel="nofollow sponsored noopener noreferrer"
          aria-label="${escapeHtml(label)}"
          title="${escapeHtml(label)}"
        >
          <img
            class="score-affiliate-image"
            src="${escapeHtml(item.image)}"
            alt="${escapeHtml(label)}"
            loading="lazy"
            decoding="async"
            onload="classifyAffiliateImage(this)"
            onerror="classifyAffiliateImage(this)"
          >
        </a>
      `;
    }

    async function loadRankingAffiliate() {
      const slot1 = document.getElementById("score-affiliate-slot-1");
      const slot2 = document.getElementById("score-affiliate-slot-2");
      const pcRail = document.getElementById("score-pc-affiliate-rail");

      try {
        const res = await fetch(TOP_JSON_URL, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const payload = await res.json();
        const products = shuffleArray(normalizeAffiliateItems(payload?.index_af));
        const selected = products.slice(0, 4);
        const pcSelected = selected.slice(0, 2);

        if (slot1) {
          slot1.innerHTML = selected.slice(0, 2).map(buildAffiliateCard).join("");
        }

        if (slot2) {
          slot2.innerHTML = selected.slice(2, 4).map(buildAffiliateCard).join("");
        }

        if (pcRail) {
          pcRail.innerHTML = pcSelected.map(buildAffiliateCard).join("");
        }
      } catch (err) {
        console.error("affiliate load failed:", err);
        if (slot1) slot1.innerHTML = "";
        if (slot2) slot2.innerHTML = "";
        if (pcRail) pcRail.innerHTML = "";
      }
    }

    function medalEmoji(rank) {
      if (rank === 1) return "🥇";
      if (rank === 2) return "🥈";
      if (rank === 3) return "🥉";
      return "";
    }

    function formatScore(value) {
      return value !== "" && !isNaN(Number(value))
        ? Number(value).toFixed(2)
        : String(value);
    }

    function extractScore(item) {
      return (
        item.current_strength_score_v2 ??
        item.current_strength_score ??
        item.current_score ??
        item.score ??
        ""
      );
    }

    function buildTop3(items) {
      return items.map(item => {
        const wrapper = document.createElement("div");
        wrapper.className = "top3-row";

        const left = document.createElement("div");
        left.className = "top3-left";

        const medal = document.createElement("span");
        medal.className = "top3-medal";
        medal.setAttribute("aria-hidden", "true");
        medal.textContent = medalEmoji(item.rank);

        const nameWrap = document.createElement("span");
        nameWrap.className = "top3-name";

        if (item.mc_id) {
          const a = document.createElement("a");
          a.href = `detail_mc/${encodeURIComponent(item.mc_id)}.html`;
          a.textContent = item.mc_name;
          a.title = item.mc_name;
          nameWrap.appendChild(a);
        } else {
          nameWrap.textContent = item.mc_name;
          nameWrap.title = item.mc_name;
        }

        const score = document.createElement("div");
        score.className = "top3-score";
        score.textContent = formatScore(item.raw_score);

        left.appendChild(medal);
        left.appendChild(nameWrap);
        wrapper.appendChild(left);
        wrapper.appendChild(score);

        return wrapper;
      });
    }

    function loadRankingsPage() {
      const statusEl = document.getElementById("rankings-status");
      const top3El = document.getElementById("top3");
      const bodyEl = document.getElementById("rankings-body");

      loadRankingsJson()
        .then((data) => {
          console.log("rankings page:", data);

          top3El.innerHTML = "";
          bodyEl.innerHTML = "";
          statusEl.classList.remove("error");

          try {
            if (data.error) {
              statusEl.textContent = "ランキングの取得に失敗しました: " + (data.message || "");
              statusEl.classList.add("error");
              return;
            }

            const rankings = Array.isArray(data.rankings) ? data.rankings.slice(0, 100) : [];

            const normalized = rankings.map((item, index) => ({
              rank: item.rank || (index + 1),
              mc_id: item.mc_id || "",
              mc_name: item.mc_name || "名前不明",
              raw_score: extractScore(item)
            }));

            const top3 = normalized.slice(0, 3);
            const rest = normalized.slice(3);

            buildTop3(top3).forEach(node => top3El.appendChild(node));

            rest.forEach((item) => {
              const tr = document.createElement("tr");

              const rankTd = document.createElement("td");
              const nameTd = document.createElement("td");
              const scoreTd = document.createElement("td");

              rankTd.textContent = item.rank;
              rankTd.className = "rank-rank";

              if (item.mc_id) {
                const a = document.createElement("a");
                a.href = `detail_mc/${encodeURIComponent(item.mc_id)}.html`;
                a.textContent = item.mc_name;
                a.className = "rank-name-link";
                nameTd.appendChild(a);
              } else {
                const span = document.createElement("span");
                span.textContent = item.mc_name;
                span.className = "rank-name-text";
                nameTd.appendChild(span);
              }

              scoreTd.textContent = formatScore(item.raw_score);
              scoreTd.className = "rank-score";

              tr.appendChild(rankTd);
              tr.appendChild(nameTd);
              tr.appendChild(scoreTd);

              bodyEl.appendChild(tr);
            });

            statusEl.textContent = "";
          } catch (err) {
            console.error(err);
            statusEl.textContent = "ランキングの描画に失敗しました";
            statusEl.classList.add("error");
          }
        })
        .catch((err) => {
          console.error(err);
          statusEl.textContent = "ランキングの読み込みに失敗しました";
          statusEl.classList.add("error");
        });
    }

    loadRankingsPage();
