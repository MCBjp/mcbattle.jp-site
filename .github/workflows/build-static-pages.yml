name: Build static pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-static-pages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate static event detail pages
        run: node scripts/generate-events.js

      - name: Generate static MC detail pages
        run: node scripts/generate-mcs.js

      - name: Generate static event list page
        run: node scripts/generate-list-event.js

      - name: Generate sitemap
        run: node scripts/generate-sitemap.js

      - name: Generate event series pages
        run: node scripts/generate-event-series.js

      - name: Show generated changes
        run: |
          echo "Generated series files:"
          find series -maxdepth 2 -type f | sort || true
          echo "Git status:"
          git status --short --untracked-files=all

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add list_event.html
          git add detail_event/*.html
          git add detail_mc/*.html
          git add sitemap.xml
          git add series/

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Generate static pages"
            git push
          fi